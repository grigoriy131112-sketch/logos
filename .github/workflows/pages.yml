name: Публикация на GitHub Pages

# Сайт «Логос» — статическая сборка в docs/. Сборку собирает tools/build_static.py
# из data/content.json, поэтому перед публикацией она пересобирается: иначе
# docs/ разошлась бы с контентом.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Проверки приложения
        run: python test_app.py

      - name: Пересобрать статическую версию
        run: python tools/build_static.py

      - name: Подготовить Pages
        uses: actions/configure-pages@v5
        with:
          # Включит Pages, если он ещё не включён в настройках репозитория.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
